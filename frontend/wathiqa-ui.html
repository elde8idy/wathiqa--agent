<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATHIQA - Document Review</title>
<style>
:root{--bg:#0b1115;--card:#121b21;--card2:#17232b;--line:#233440;--tx:#e6eef2;--mut:#8aa0ac;--acc:#2dd4bf;--acc2:#14b8a6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0f2a2c 0,transparent 60%),var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#0ea5e9);display:grid;place-items:center;color:#04201d;font-weight:800}
h1{font-size:18px;margin:0}h1 small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.spacer{flex:1}
.api{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:10px}
.api input{background:transparent;border:0;color:var(--tx);width:210px;outline:none;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.off{background:var(--bad)}
main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;padding:22px 28px;max-width:1280px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr;padding:14px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h2{margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
textarea{width:100%;min-height:240px;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical;outline:none}
textarea:focus,.api:focus-within{border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:8px 12px;border-radius:10px;font:inherit;font-size:13px;transition:.15s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04201d;border:0;font-weight:700;padding:11px 18px;font-size:14px}
button.primary:hover{filter:brightness(1.1);color:#04201d}
button:disabled{opacity:.5;cursor:wait}
button.ok{background:rgba(52,211,153,.15);border-color:var(--ok);color:var(--ok)}
button.no{background:rgba(248,113,113,.12);border-color:var(--bad);color:var(--bad)}
.lbl{font-size:12px;color:var(--mut);margin:12px 0 4px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--card2)}
.chip.flag{border-color:var(--warn);color:var(--warn);background:rgba(251,191,36,.08)}
.badge{display:inline-block;padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px}
.b-ok{background:rgba(52,211,153,.15);color:var(--ok)}.b-warn{background:rgba(251,191,36,.15);color:var(--warn)}.b-bad{background:rgba(248,113,113,.15);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kv{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:16px;word-break:break-word}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#0ea5e9)}
.empty{color:var(--mut);text-align:center;padding:60px 10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #04201d55;border-top-color:#04201d;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:rgba(248,113,113,.1);border:1px solid var(--bad);color:var(--bad);padding:10px 12px;border-radius:12px;margin-bottom:12px;white-space:pre-wrap}
.review{border:1px solid var(--warn);background:rgba(251,191,36,.06);border-radius:14px;padding:14px;margin:14px 0}
.review h3{margin:0 0 6px;color:var(--warn);font-size:15px}
ul{margin:6px 0;padding-left:20px}
.report{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 18px;margin-top:14px}
.report h1,.report h2,.report h3{font-size:16px;margin:14px 0 6px;color:var(--acc)}
.report code{background:#0b1115;padding:1px 6px;border-radius:6px;font-size:13px}
.hist button{display:block;width:100%;text-align:left;margin-bottom:6px}
details{margin-top:12px;color:var(--mut)}pre{white-space:pre-wrap;background:var(--card2);padding:10px;border-radius:10px;font-size:12px;overflow:auto}
</style>
</head>
<body>
<header>
  <div class="logo">W</div>
  <h1>WATHIQA <small>Expense document review agent</small></h1>
  <div class="spacer"></div>
  <div class="api"><span class="dot" id="dot"></span><input id="base" value="http://127.0.0.1:8000" spellcheck="false" title="API base URL"><button id="ping" style="padding:3px 8px">Check</button></div>
</header>
<main>
  <section class="card">
    <h2>Document</h2>
    <div class="lbl">Samples</div>
    <div class="row" id="samples"></div>
    <textarea id="doc" placeholder="Paste invoice / expense claim / receipt text here..."></textarea>
    <div class="row">
      <button id="file">Load .txt / .md file</button>
      <input type="file" id="fileIn" accept=".txt,.md,text/plain" hidden>
      <button id="clear">Clear</button>
    </div>
    <details><summary>Or review a file by path on the server (.txt/.md/.pdf)</summary>
      <input id="path" placeholder="e.g. data/sample_docs/invoice_clean.txt" style="width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:8px">
    </details>
    <div class="row"><button class="primary" id="go">Review document</button></div>
    <div class="lbl">History (this browser)</div>
    <div class="hist" id="hist"></div>
  </section>
  <section class="card" id="out"><div class="empty">Paste a document or pick a sample, then press Review.<br>Result appears here.</div></section>
</main>
<script>
const SAMPLES = {"expense over limit": "EXPENSE CLAIM\nClaim form: EC-2026-041\nVendor: Lotus Restaurant\nDate: 2026-10-08\nCurrency: EGP\nCategory: meals\nNet: 780.00\nVAT: 109.20\nTotal: 889.20\nLine items:\n1x Client dinner @ 780.00\nReason: client dinner, reimbursement claim.\n", "invoice clean": "INVOICE\nInvoice number: TH-2026-118\nVendor: TechHub Software Ltd\nDate: 2026-10-02\nCurrency: EGP\nCategory: software\nNet: 1000.00\nVAT: 140.00\nTotal: 1140.00\nBill to: Example Co\nLine items:\n1x Annual SaaS subscription @ 1000.00\nNotes: annual software subscription invoice, due on receipt.\n", "invoice missing fields": "INVOICE\nInvoice number: NCS-0091\nVendor: Nile Cloud Services\nCurrency: EGP\nCategory: software\nNet: 500.00\nVAT: 70.00\nTotal: 570.00\nBill to: Example Co\nNotes: monthly cloud hosting invoice. Date is not stated on this copy.\n", "invoice vat mismatch": "INVOICE\nInvoice number: DOS-7782\nVendor: Delta Office Supplies\nDate: 2026-10-05\nCurrency: EGP\nCategory: office_supplies\nNet: 1000.00\nVAT: 200.00\nTotal: 1200.00\nBill to: Example Co\nLine items:\n10x Printer paper @ 100.00\n"};
const $ = id => document.getElementById(id);
const base = () => $('base').value.replace(/\/+$/,'');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

for (const [name, text] of Object.entries(SAMPLES)) {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { $('doc').value = text; $('path').value=''; };
  $('samples').appendChild(b);
}
$('clear').onclick = () => { $('doc').value=''; $('path').value=''; };
$('file').onclick = () => $('fileIn').click();
$('fileIn').onchange = async e => { const f = e.target.files[0]; if (f) $('doc').value = await f.text(); };

async function api(path, opts) {
  let r;
  try { r = await fetch(base()+path, opts); }
  catch (e) { throw new Error('Cannot reach the API at '+base()+'. Is the server running? If it is, the browser is blocking the request (CORS): add CORSMiddleware to api.py (see instructions).'); }
  let data = null; try { data = await r.json(); } catch(_) {}
  if (!r.ok) throw new Error('HTTP '+r.status+': '+(data && (typeof data.detail==='string' ? data.detail : JSON.stringify(data.detail)) || r.statusText));
  return data;
}
async function ping() {
  try { const h = await api('/health'); $('dot').className='dot on'; $('dot').title='LLM: '+h.llm_provider; }
  catch(e){ $('dot').className='dot off'; $('dot').title=e.message; }
}
$('ping').onclick = ping; $('base').onchange = ping; ping();

function md(src) {
  const lines = esc(src).split('\n'); let out='', inList=false;
  for (let l of lines) {
    l = l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
    let m;
    if ((m = l.match(/^(#{1,3})\s+(.*)/))) { if(inList){out+='</ul>';inList=false} out += `<h${m[1].length}>${m[2]}</h${m[1].length}>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if(!inList){out+='<ul>';inList=true} out += `<li>${m[1]}</li>`; }
    else { if(inList){out+='</ul>';inList=false} if(l.trim()) out += `<p>${l}</p>`; }
  }
  return out + (inList?'</ul>':'');
}
const decClass = d => /approved|auto/.test(d||'') ? 'b-ok' : /reject/.test(d||'') ? 'b-bad' : 'b-warn';

let busy = false;
function setBusy(b, label) { busy=b; for (const id of ['go']) { $(id).disabled=b; } $('go').innerHTML = b ? '<span class="spin"></span>Reviewing...' : 'Review document'; }

function render(r, err) {
  let h = '';
  if (err) h += `<div class="err">${esc(err)}</div>`;
  if (r) {
    const ex = r.extraction || {};
    const conf = r.confidence ?? 0;
    h += `<div class="row" style="align-items:center"><span class="badge ${decClass(r.decision)}">${esc(r.decision || r.status)}</span>
      <span class="chip">status: ${esc(r.status)}</span><span class="chip">type: ${esc(r.doc_type)}</span>
      <span class="chip" title="thread id">thread ${esc((r.thread_id||'').slice(0,8))}</span></div>`;
    h += `<div class="kv"><span>Extraction confidence ${Math.round(conf*100)}%</span><div class="bar"><i style="width:${Math.round(conf*100)}%"></i></div></div>`;
    h += `<div class="grid">` + ['vendor','amount','currency','date','category','net_amount','vat_amount'].map(k=>`<div class="kv"><span>${k.replace('_',' ')}</span><b>${ex[k] ?? '-'}</b></div>`).join('') + `</div>`;
    const fl = r.flags || [];
    h += `<div class="lbl">Flags</div><div>` + (fl.length ? fl.map(f=>`<span class="chip flag">${esc(f)}</span> `).join('') : '<span class="chip">none</span>') + `</div>`;
    if (r.status === 'needs_review') {
      const q = r.review_request || {};
      h += `<div class="review"><h3>Human review required</h3>`;
      if ((q.reasons||[]).length) h += '<ul>' + q.reasons.map(x=>`<li>${esc(x)}</li>`).join('') + '</ul>';
      if ((q.investigation||[]).length) h += '<div class="lbl">Agent investigation</div><ul>' + q.investigation.map(x=>`<li>${esc(x)}</li>`).join('') + '</ul>';
      h += `<div class="row"><button class="ok" onclick="resume('${esc(r.thread_id)}','approve')">Approve</button><button class="no" onclick="resume('${esc(r.thread_id)}','reject')">Reject</button></div></div>`;
    }
    if (r.report) h += `<div class="report">${md(r.report)}</div>`;
    h += `<details><summary>Raw API response</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details>`;
  }
  $('out').innerHTML = h;
}

const HKEY='wathiqa_hist';
const hist = () => JSON.parse(localStorage.getItem(HKEY)||'[]');
function save(r) {
  const hs = hist().filter(x=>x.thread_id!==r.thread_id);
  hs.unshift({thread_id:r.thread_id, t:Date.now(), vendor:r.extraction?.vendor, decision:r.decision, r});
  localStorage.setItem(HKEY, JSON.stringify(hs.slice(0,15))); drawHist();
}
function drawHist() {
  $('hist').innerHTML = hist().map((x,i)=>`<button onclick="render(hist()[${i}].r)">${esc(x.vendor||'document')} - ${esc(x.decision)}</button>`).join('') || '<span class="chip">empty</span>';
}
drawHist();

async function review() {
  const text = $('doc').value.trim(), path = $('path').value.trim();
  if (!text && !path) return render(null, 'Paste a document, pick a sample or enter a file path first.');
  const body = text ? {document_text:text} : {document_path:path};
  setBusy(true);
  try { const r = await api('/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); render(r); save(r); }
  catch(e){ render(null, e.message); }
  setBusy(false);
}
async function resume(id, feedback) {
  setBusy(true);
  try { const r = await api('/reviews/'+encodeURIComponent(id)+'/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback})}); render(r); save(r); }
  catch(e){ render(null, e.message); }
  setBusy(false);
}
$('go').onclick = review;
</script>
</body>
</html>
