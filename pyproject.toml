[project]
name = "wathiqa-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eldeghidy", email = "ag2436394@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "langchain-groq>=1.2.1",
    "langgraph>=0.2.60",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pypdf>=7.1.1",
    "uvicorn>=0.29",
]

[project.scripts]
wathiqa-agent = "wathiqa_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
